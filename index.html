<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kill-Chain</title>
    <meta name="description" content="Kill-Chain — a tactical audio engine." />
    <style>
      /* ───────────────────────────────────────────────────────────────
         Boot splash — inlined so it paints instantly, before any JS/CSS
         bundle loads. main.tsx plays the synthesized 5 s boot sting at the
         reveal and removes the splash when it ends.
         Themed to match the default "Night Ops" look: tactical green + amber
         on deep black-green.
         ─────────────────────────────────────────────────────────────── */
      :root {
        --b-steel: #78c678;
        --b-blood: #e07840;
        --b-violet: #62966e;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 38px;
        overflow: hidden;
        background:
          radial-gradient(130% 130% at 50% 30%, #0c0f0d 0%, #050706 62%);
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        opacity: 1;
        transition: opacity 0.6s ease;
      }
      #boot-splash.boot-hide { opacity: 0; pointer-events: none; }

      /* The splash holds on pure black for a beat, then the whole stage
         (emblem + brackets + wordmark) fades/scales in together — synced to
         the moment the intro sound starts. The DROP in the sound lands at
         +2.85 s: the flash, the ARMED stamp and the emblem punch all key off
         that instant. */
      .boot-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 34px;
        opacity: 0;
        transform: translateY(10px) scale(0.97);
        transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .boot-stage.reveal { opacity: 1; transform: none; }

      /* Targeting brackets converging on the emblem. */
      .boot-brackets {
        position: absolute;
        top: -30px;
        width: 340px;
        height: 340px;
        pointer-events: none;
      }
      .boot-brackets i {
        position: absolute;
        width: 34px;
        height: 34px;
        border: 2px solid rgba(120, 198, 120, 0.65);
        opacity: 0;
      }
      .boot-brackets .b1 { top: 0; left: 0; border-right: none; border-bottom: none; }
      .boot-brackets .b2 { top: 0; right: 0; border-left: none; border-bottom: none; }
      .boot-brackets .b3 { bottom: 0; left: 0; border-right: none; border-top: none; }
      .boot-brackets .b4 { bottom: 0; right: 0; border-left: none; border-top: none; }
      .reveal .boot-brackets .b1 { animation: boot-brk 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s forwards; --tx: 60px; --ty: 60px; }
      .reveal .boot-brackets .b2 { animation: boot-brk 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.25s forwards; --tx: -60px; --ty: 60px; }
      .reveal .boot-brackets .b3 { animation: boot-brk 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.35s forwards; --tx: 60px; --ty: -60px; }
      .reveal .boot-brackets .b4 { animation: boot-brk 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.45s forwards; --tx: -60px; --ty: -60px; }
      @keyframes boot-brk {
        0% { opacity: 0; transform: translate(calc(var(--tx) * -1.6), calc(var(--ty) * -1.6)); }
        60% { opacity: 1; }
        100% { opacity: 0.9; transform: translate(0, 0); }
      }

      /* One scanline sweep down the whole splash. */
      .boot-scanline {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(120, 198, 120, 0.5), transparent);
        box-shadow: 0 0 14px rgba(120, 198, 120, 0.35);
        opacity: 0;
      }
      #boot-splash:has(.reveal) .boot-scanline {
        animation: boot-scan 1.5s cubic-bezier(0.4, 0, 0.6, 1) 0.2s 1;
      }
      @keyframes boot-scan {
        0% { opacity: 0; transform: translateY(0); }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% { opacity: 0; transform: translateY(100vh); }
      }

      /* The DROP flash + emblem punch (keyed to +2.85 s after reveal). */
      .boot-flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(60% 60% at 50% 42%, rgba(224, 120, 64, 0.5), rgba(120, 198, 120, 0.12) 45%, transparent 75%);
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash:has(.reveal) .boot-flash {
        animation: boot-flash 0.6s ease-out 2.85s 1;
      }
      @keyframes boot-flash {
        0% { opacity: 0; }
        10% { opacity: 1; }
        100% { opacity: 0; }
      }
      .reveal .boot-emblem { animation: boot-punch 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) 2.85s 1; }
      @keyframes boot-punch {
        0% { transform: scale(1); }
        18% { transform: scale(1.12); }
        100% { transform: scale(1); }
      }

      /* ARMED stamp — slams in on the drop. */
      .boot-armed {
        margin-top: 2px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.7em;
        text-indent: 0.7em;
        text-transform: uppercase;
        color: var(--b-blood);
        text-shadow: 0 0 12px rgba(224, 120, 64, 0.6);
        opacity: 0;
      }
      .reveal .boot-armed { animation: boot-armed 0.35s cubic-bezier(0.1, 1.4, 0.3, 1) 2.85s forwards; }
      @keyframes boot-armed {
        0% { opacity: 0; transform: scale(2.4); }
        100% { opacity: 1; transform: scale(1); }
      }

      /* Faint engineering grid + vignette for depth. */
      #boot-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(98, 150, 110, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 198, 120, 0.05) 1px, transparent 1px);
        background-size: 46px 46px;
        mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.9), transparent 72%);
        animation: boot-grid 16s linear infinite;
      }
      #boot-splash::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(60% 50% at 50% 42%, transparent 40%, rgba(0,0,0,0.55) 100%);
        pointer-events: none;
      }

      .boot-emblem {
        position: relative;
        width: 200px;
        height: 200px;
        display: grid;
        place-items: center;
      }
      .boot-emblem span {
        position: absolute;
        inset: 0;
        margin: auto;
        border-radius: 50%;
        border: 1.5px solid transparent;
      }
      .boot-emblem .r1 {
        width: 200px; height: 200px;
        border-top-color: var(--b-steel);
        border-right-color: rgba(120, 198, 120, 0.28);
        box-shadow: 0 0 16px rgba(120, 198, 120, 0.12);
        animation: boot-spin 3.4s cubic-bezier(0.6,0,0.4,1) infinite;
      }
      .boot-emblem .r2 {
        width: 150px; height: 150px;
        border-bottom-color: var(--b-violet);
        border-left-color: rgba(98, 150, 110, 0.25);
        box-shadow: 0 0 14px rgba(98, 150, 110, 0.1);
        animation: boot-spin 2.6s linear infinite reverse;
      }
      .boot-emblem .r3 {
        width: 104px; height: 104px;
        border-top-color: var(--b-blood);
        border-right-color: rgba(224, 120, 64, 0.28);
        box-shadow: 0 0 14px rgba(224, 120, 64, 0.12);
        animation: boot-spin 1.9s ease-in-out infinite;
      }
      .boot-core {
        width: 14px; height: 14px;
        border: none !important;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, var(--b-steel) 70%);
        box-shadow:
          0 0 10px 2px rgba(255, 255, 255, 0.6),
          0 0 26px 5px rgba(120, 198, 120, 0.28);
        animation: boot-core 1.8s ease-in-out infinite;
      }

      /* Equalizer bars under the emblem. */
      .boot-eq {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 30px;
      }
      .boot-eq i {
        display: block;
        width: 5px;
        border-radius: 3px;
        background: linear-gradient(180deg, var(--b-steel), var(--b-violet));
        transform-origin: bottom;
        animation: boot-eq 1.1s ease-in-out infinite;
      }
      .boot-eq i:nth-child(1) { animation-delay: 0s;    height: 30px; }
      .boot-eq i:nth-child(2) { animation-delay: 0.12s; height: 30px; background: linear-gradient(180deg, var(--b-violet), var(--b-blood)); }
      .boot-eq i:nth-child(3) { animation-delay: 0.24s; height: 30px; }
      .boot-eq i:nth-child(4) { animation-delay: 0.36s; height: 30px; background: linear-gradient(180deg, var(--b-blood), var(--b-violet)); }
      .boot-eq i:nth-child(5) { animation-delay: 0.48s; height: 30px; }
      .boot-eq i:nth-child(6) { animation-delay: 0.30s; height: 30px; background: linear-gradient(180deg, var(--b-violet), var(--b-blood)); }
      .boot-eq i:nth-child(7) { animation-delay: 0.18s; height: 30px; }

      .boot-wordmark { text-align: center; }
      .boot-title {
        position: relative;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
        background: linear-gradient(100deg, #b6c6ac, #ffffff 45%, var(--b-blood));
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: boot-shimmer 4.2s ease-in-out infinite;
      }
      /* Glitch reveal: two clipped ghost copies jitter for the first beat. */
      .boot-title::before,
      .boot-title::after {
        content: attr(data-text);
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        background: none;
        -webkit-background-clip: initial;
        background-clip: initial;
        opacity: 0;
      }
      .boot-title::before { color: rgba(224, 120, 64, 0.85); }
      .boot-title::after { color: rgba(120, 198, 220, 0.8); }
      .reveal .boot-title::before { animation: boot-glitch-a 1.1s steps(2, jump-none) 0.45s 2; }
      .reveal .boot-title::after { animation: boot-glitch-b 1.1s steps(3, jump-none) 0.45s 2; }
      @keyframes boot-glitch-a {
        0% { opacity: 0.8; transform: translate(-3px, -2px); clip-path: inset(10% 0 62% 0); }
        35% { opacity: 0.6; transform: translate(2px, 1px); clip-path: inset(48% 0 22% 0); }
        70% { opacity: 0.7; transform: translate(-2px, 2px); clip-path: inset(70% 0 6% 0); }
        100% { opacity: 0; transform: none; }
      }
      @keyframes boot-glitch-b {
        0% { opacity: 0.7; transform: translate(3px, 2px); clip-path: inset(58% 0 18% 0); }
        40% { opacity: 0.5; transform: translate(-2px, -1px); clip-path: inset(6% 0 78% 0); }
        80% { opacity: 0.6; transform: translate(1px, -2px); clip-path: inset(34% 0 44% 0); }
        100% { opacity: 0; transform: none; }
      }
      .boot-sub {
        margin-top: 12px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.62em;
        text-indent: 0.62em;
        text-transform: uppercase;
        color: rgba(150, 165, 148, 0.75);
      }

      .boot-bar {
        width: 260px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
      }
      .boot-bar::after {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--b-steel), var(--b-violet), var(--b-blood));
        box-shadow: 0 0 12px rgba(120, 198, 120, 0.6);
      }
      /* Bar only fills once the stage is revealed, finishing as the splash
         ends (the splash dismisses when the 4.2 s boot sting completes). */
      .boot-stage.reveal .boot-bar::after {
        animation: boot-fill 4.2s cubic-bezier(0.4, 0.05, 0.2, 1) forwards;
      }

      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-core {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.5); opacity: 0.65; }
      }
      @keyframes boot-eq {
        0%, 100% { transform: scaleY(0.25); opacity: 0.7; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      @keyframes boot-shimmer { to { background-position: 250% 0; } }
      @keyframes boot-grid { to { background-position: 46px 46px; } }
      @keyframes boot-fill { 0% { width: 0%; } 100% { width: 100%; } }

      @media (prefers-reduced-motion: reduce) {
        .boot-emblem .r1, .boot-emblem .r2, .boot-emblem .r3,
        .boot-core, .boot-eq i, .boot-title, #boot-splash::before,
        .boot-title::before, .boot-title::after,
        .boot-brackets i, .boot-scanline, .boot-flash, .boot-emblem {
          animation: none;
        }
        .boot-brackets i { opacity: 0.7; transform: none; }
        .boot-armed { animation: none; }
        .reveal .boot-armed { opacity: 1; }
        .boot-stage { transition: opacity 0.4s ease; transform: none; }
        .boot-stage.reveal .boot-bar::after { animation: boot-fill 1s linear forwards; }
      }
    </style>
  </head>
  <body class="bg-ink overflow-hidden">
    <div id="boot-splash">
      <div class="boot-scanline"></div>
      <div class="boot-flash"></div>
      <div id="boot-stage" class="boot-stage">
        <div class="boot-brackets">
          <i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i>
        </div>
        <div class="boot-emblem">
          <span class="r1"></span>
          <span class="r2"></span>
          <span class="r3"></span>
          <span class="boot-core"></span>
        </div>
        <div class="boot-eq">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="boot-wordmark">
          <div class="boot-title" data-text="Kill-Chain">Kill-Chain</div>
          <div class="boot-sub">Tactical Audio Engine</div>
          <div class="boot-armed">Systems Armed</div>
        </div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      /* Splash sequence: hold on black for a beat, THEN reveal the animation +
         wordmark. `__bootStart` marks page load; `__introStart` marks the
         reveal instant. The boot SOUND lives in the app bundle
         (src/audio/splashSound.ts, a synthesized 5 s sting) — main.tsx starts
         it at the reveal and dismisses the splash when the 5 s run out.
         Keeping the reveal inline means the splash animates even if the
         bundle is still loading. */
      (function () {
        window.__bootStart = performance.now();
        var BLACK_MS = 900; // black lead-in before everything comes in together
        var stage = document.getElementById("boot-stage");
        window.setTimeout(function () {
          if (stage) stage.classList.add("reveal");
          window.__introStart = performance.now();
        }, BLACK_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
