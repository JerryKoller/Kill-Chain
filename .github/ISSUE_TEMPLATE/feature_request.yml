name: Feature request
description: Suggest an idea for Kill Chain
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Describe what you'd like and how it would help your listening workflow.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: e.g. "I can't easily compare two EQ curves" or "Restoration doesn't handle my source well"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement you'd want.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area of Kill Chain?
      options:
        - Kill Chain / DSP chain
        - Sculptor (restoration / clarity)
        - Calibration / Deadflat
        - Tractor Beam
        - 3rd Dimension / spatial
        - Fire Command
        - Airspace
        - Scope / Visualizers
        - Settings / UI
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, examples from other apps, or related issues.
